name: build

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: NexusModCleanup-windows.exe
          - os: ubuntu-22.04
            asset: NexusModCleanup-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nexus_dedupe.py --help
      - run: pip install pyinstaller==6.11.1
      - run: pyinstaller --onefile --windowed --name NexusModCleanup nexus_dedupe_gui.py
      - name: Rename binary
        shell: bash
        run: mv dist/NexusModCleanup* "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
