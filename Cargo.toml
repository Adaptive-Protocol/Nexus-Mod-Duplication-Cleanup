[package]
name = "nexus-mod-cleanup"
version = "2.1.1"
edition = "2024"
description = "Nexus Mod Duplication Cleanup"
license = "MIT"
repository = "https://github.com/Adaptive-Protocol/Nexus-Mod-Duplication-Cleanup"
publish = false

[[bin]]
name = "NexusModCleanup"
path = "src/main.rs"

[[bin]]
name = "Uninstall"
path = "src/uninstall.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.32.3", features = ["persistence"] }
fancy-regex = "0.19"
rfd = "0.15"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
